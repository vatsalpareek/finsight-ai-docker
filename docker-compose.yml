version: '3.8'

services:
  finsight-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Expose all origins internally, Nginx/frontend will communicate with it
      - CORS_ORIGINS=*
    restart: unless-stopped

  finsight-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - finsight-backend
    restart: unless-stopped
